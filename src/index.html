<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayAll — Smart Card Recommendations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #08080c; color: #d0d0d0; font-size: 14px; }

    .app { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
    .main { overflow-y: auto; padding: 2rem 2.5rem; }

    /* ---- Header ---- */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #151520; }
    .logo { font-size: 1.2rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .logo em { font-style: normal; color: #2aaa6a; }
    .lang-btns { display: flex; gap: 4px; }
    .lang-btn { padding: 5px 12px; border: 1px solid #1a1a2a; background: transparent; color: #666; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; }
    .lang-btn.active { border-color: #2aaa6a; color: #6ee7b7; background: #0a1a14; }

    /* ---- User profile hero ---- */
    .profile { background: linear-gradient(135deg, #0d0d18 0%, #0a1420 100%); border: 1px solid #151530; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .profile-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .profile-name { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .profile-desc { font-size: 0.82rem; color: #777; margin-top: 2px; }
    .profile-location { display: inline-flex; align-items: center; gap: 6px; background: #1a1a0a; border: 1px solid #3a3a1a; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #fcd34d; font-weight: 600; }
    .profile-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .ptag { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .ptag-g { background: #0a1a14; border: 1px solid #1a3a2a; color: #6ee7b7; }
    .ptag-p { background: #14101f; border: 1px solid #252040; color: #c4b5fd; }
    .ptag-y { background: #1a1a0a; border: 1px solid #2a2a1a; color: #fcd34d; }
    .ptag-d { background: #111; border: 1px solid #1a1a1a; color: #666; }

    /* ---- Spending analysis (replaces pipeline steps) ---- */
    .spending { background: #0d0d14; border: 1px solid #151525; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .spending-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #555; font-weight: 700; margin-bottom: 12px; }
    .spend-bars { display: flex; flex-direction: column; gap: 8px; }
    .spend-row { display: flex; align-items: center; gap: 10px; }
    .spend-cat { font-size: 12px; color: #999; width: 90px; text-align: right; }
    .spend-track { flex: 1; height: 8px; background: #111125; border-radius: 4px; overflow: hidden; }
    .spend-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #7c3aed, #c4b5fd); }
    .spend-val { font-size: 12px; color: #6ee7b7; font-weight: 600; width: 70px; }
    .spend-pct { font-size: 10px; color: #555; width: 36px; text-align: right; }

    /* ---- 3 business CTAs ---- */
    .ctas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
    .cta-card { background: #0d0d14; border: 1px solid #151525; border-radius: 12px; padding: 1rem; text-align: center; transition: all 0.2s; cursor: pointer; }
    .cta-card:hover { border-color: #2aaa6a; }
    .cta-card.hl { border-color: #2aaa6a; background: linear-gradient(135deg, #0a1a14, #0d0d18); }
    .cta-icon { font-size: 1.5rem; margin-bottom: 6px; }
    .cta-label { font-size: 13px; font-weight: 700; color: #6ee7b7; margin-bottom: 4px; }
    .cta-desc { font-size: 11px; color: #555; line-height: 1.3; }

    /* ---- Progress indicator (replaces pipeline) ---- */
    .progress { margin-bottom: 1.5rem; display: none; }
    .progress.visible { display: block; }
    .progress-bar { height: 3px; background: #151525; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #2aaa6a, #7c3aed); border-radius: 2px; transition: width 0.5s ease; }
    .progress-text { font-size: 11px; color: #555; margin-top: 6px; }

    /* ---- Results ---- */
    .results { display: none; }
    .results.visible { display: block; }
    .error-msg { background: #1a0a0a; border: 1px solid #3a1a1a; border-radius: 10px; padding: 1rem; color: #f87171; display: none; font-size: 13px; }
    .error-msg.visible { display: block; }

    /* Location insight */
    .loc-badge { display: inline-flex; align-items: center; gap: 6px; background: #1a1a0a; border: 1px solid #3a3a1a; border-radius: 20px; padding: 5px 14px; font-size: 12px; color: #fcd34d; font-weight: 600; margin-bottom: 12px; }
    .loc-explain { font-size: 12px; color: #777; margin-bottom: 16px; line-height: 1.5; }

    /* Insights */
    .insights { background: #0d0d18; border: 1px solid #151530; border-radius: 12px; padding: 1rem; margin-bottom: 16px; }
    .insights-hd { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #555; font-weight: 700; margin-bottom: 10px; }
    .ins-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #111125; }
    .ins-item:last-child { border-bottom: none; }
    .ins-icon { font-size: 16px; }
    .ins-title { font-size: 13px; font-weight: 600; color: #ddd; }
    .ins-desc { font-size: 12px; color: #888; line-height: 1.4; margin-top: 2px; }
    .ins-ev { font-size: 11px; color: #7c3aed; margin-top: 2px; }

    /* Bit2Go hero */
    .b2g { background: linear-gradient(135deg, #0a1a14, #0a1020); border: 2px solid #2aaa6a; border-radius: 14px; padding: 1.25rem; margin-bottom: 16px; }
    .b2g-badge { display: inline-block; background: #2aaa6a; color: #fff; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 3px; margin-bottom: 8px; }
    .b2g-hl { font-size: 16px; font-weight: 700; color: #6ee7b7; margin-bottom: 4px; }
    .b2g-d { font-size: 13px; color: #999; line-height: 1.4; margin-bottom: 6px; }
    .b2g-v { font-size: 13px; color: #6ee7b7; font-weight: 600; margin-bottom: 4px; }
    .b2g-u { font-size: 12px; color: #fcd34d; margin-bottom: 10px; }
    .b2g-btn { background: #2aaa6a; color: #fff; border: none; padding: 8px 24px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .b2g-btn:hover { background: #25995e; }

    /* Primary card */
    .pcard { background: #0d0d14; border: 2px solid #7c3aed; border-radius: 14px; padding: 1.25rem; margin-bottom: 16px; position: relative; }
    .pcard-badge { position: absolute; top: -10px; left: 16px; background: #7c3aed; color: #fff; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 10px; border-radius: 8px; }
    .pcard-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 6px; }
    .pcard-name { font-size: 15px; font-weight: 700; color: #fff; }
    .pcard-score { padding: 3px 10px; border-radius: 14px; font-size: 13px; font-weight: 700; }
    .pcard-score.hi { background: #0a1a14; color: #6ee7b7; }
    .pcard-score.md { background: #1a1a0a; color: #fcd34d; }
    .pcard-score.lo { background: #14101f; color: #c4b5fd; }
    .pcard-tag { color: #c4b5fd; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .pcard-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #111; border: 1px solid #1a1a2a; color: #777; }
    .chip-g { border-color: #1a3a2a; color: #6ee7b7; }

    .hook { background: #1a1a0a; border: 1px solid #2a2a1a; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; color: #fcd34d; font-weight: 600; line-height: 1.4; }
    .sav { background: #0a1a14; border: 1px solid #1a3a2a; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .sav-amt { font-size: 22px; font-weight: 800; color: #6ee7b7; }
    .sav-per { font-size: 10px; color: #6ee7b7; opacity: 0.6; }
    .sav-det { font-size: 12px; color: #6ee7b7; opacity: 0.7; }
    .sav-yr { font-size: 11px; color: #34d399; margin-top: 2px; }

    .pcard-reason { font-size: 13px; color: #999; line-height: 1.5; margin-bottom: 10px; }

    .bd { background: #08080f; border: 1px solid #111125; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .bd-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #444; font-weight: 700; margin-bottom: 8px; }
    .bd-row { margin-bottom: 8px; }
    .bd-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
    .bd-label { color: #aaa; }
    .bd-val { color: #666; }
    .bd-track { height: 5px; background: #111125; border-radius: 3px; overflow: hidden; }
    .bd-fill { height: 100%; border-radius: 3px; }
    .bd-fill.hi { background: #6ee7b7; } .bd-fill.md { background: #fcd34d; } .bd-fill.lo { background: #f87171; }
    .bd-exp { font-size: 11px; color: #555; margin-top: 2px; }

    .pcard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
    .pcard-grid h4 { font-size: 12px; margin-bottom: 4px; }
    .pcard-grid .pro h4 { color: #6ee7b7; }
    .pcard-grid .con h4 { color: #f87171; }
    .pcard-grid li { font-size: 12px; color: #999; margin-left: 12px; line-height: 1.4; margin-bottom: 2px; }

    .act { padding: 8px 12px; background: #14101f; border: 1px solid #252040; border-radius: 8px; font-size: 13px; color: #c4b5fd; margin-bottom: 8px; }
    .fb-btns { display: flex; gap: 6px; }
    .fb-btn { padding: 5px 12px; border: 1px solid #1a1a2a; background: transparent; color: #777; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; }
    .fb-btn:hover { border-color: #444; }

    /* Backups */
    .bk-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #444; font-weight: 700; margin-bottom: 10px; }
    .bk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .bk-card { background: #0d0d14; border: 1px solid #151525; border-radius: 10px; padding: 12px; }
    .bk-card .pcard-head { margin: 0 0 4px; }
    .bk-card .pcard-name { font-size: 13px; }
    .bk-card .pcard-tag { font-size: 12px; margin-bottom: 4px; }
    .bk-card .pcard-reason { font-size: 12px; margin-bottom: 6px; }
    .bk-adv { background: #0a1a14; border: 1px solid #1a3a2a; border-radius: 4px; padding: 4px 8px; font-size: 11px; color: #6ee7b7; margin-bottom: 6px; }
    .bk-pti { background: #1a1a0a; border: 1px solid #2a2a1a; border-radius: 4px; padding: 4px 8px; font-size: 11px; color: #fcd34d; }

    .wn-title { font-size: 12px; color: #444; cursor: pointer; margin-top: 10px; }
    .wn-title:hover { color: #666; }
    .wn-list { display: none; margin-top: 6px; }
    .wn-list.visible { display: block; }
    .wn-item { font-size: 12px; color: #555; padding: 3px 0; }
    .wn-item b { color: #777; }

    /* ---- Chat panel ---- */
    .chat { display: flex; flex-direction: column; border-left: 1px solid #151520; background: #0a0a10; }
    .chat-hd { padding: 16px 20px; border-bottom: 1px solid #151520; display: flex; align-items: center; gap: 8px; }
    .chat-dot { width: 8px; height: 8px; background: #2aaa6a; border-radius: 50%; }
    .chat-hd-text { font-size: 14px; font-weight: 700; color: #fff; }
    .chat-hd-sub { font-size: 11px; color: #555; }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .chat-empty { color: #444; font-size: 13px; text-align: center; padding: 3rem 1.5rem; line-height: 1.6; }
    .cmsg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
    .cmsg.u { align-self: flex-end; background: #1e1033; color: #c4b5fd; border-bottom-right-radius: 4px; }
    .cmsg.a { align-self: flex-start; background: #111118; color: #ccc; border-bottom-left-radius: 4px; }
    .cmsg.a.streaming { border: 1px solid #1a1a2a; }
    .cmsg .tool-tag { display: inline-block; background: #0a1a14; border: 1px solid #1a3a2a; color: #6ee7b7; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin: 4px 0; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
    .quick-btn { padding: 6px 12px; background: #111118; border: 1px solid #1a1a2a; color: #999; border-radius: 18px; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .quick-btn:hover { border-color: #2aaa6a; color: #6ee7b7; }
    .chat-in { padding: 12px 16px; border-top: 1px solid #151520; display: flex; gap: 8px; }
    .chat-input { flex: 1; padding: 10px 14px; background: #0d0d14; border: 1px solid #1a1a2a; border-radius: 10px; color: #ddd; font-size: 13px; outline: none; resize: none; font-family: inherit; }
    .chat-input:focus { border-color: #2aaa6a; }
    .chat-send { padding: 10px 20px; background: #2aaa6a; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .chat-send:hover { background: #25995e; }
    .chat-send:disabled { background: #222; color: #555; }

    /* ---- Modal ---- */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.visible { display:flex; }
    .modal { background:#0d0d14; border:1px solid #1a1a2a; border-radius:14px; padding:1.5rem; width:90%; max-width:360px; }
    .modal h3 { color:#fff; font-size:15px; margin-bottom:12px; }
    .modal-step { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #111; font-size:13px; color:#ccc; }
    .toggle { position:relative; width:40px; height:22px; border-radius:11px; background:#4a1a1a; cursor:pointer; transition:background .2s; }
    .toggle.on { background:#1a4a2a; }
    .toggle::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s; }
    .toggle.on::after { transform:translateX(18px); }
    .modal-btns { display:flex; gap:8px; margin-top:14px; }
    .modal-btns button { flex:1; padding:8px; border:none; border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600; }
    .modal-btns .ok { background:#7c3aed; color:#fff; }
    .modal-btns .no { background:#1a1a2a; color:#888; }

    @media (max-width:900px) {
      .app { grid-template-columns:1fr; grid-template-rows:1fr 50vh; }
      .ctas { grid-template-columns:1fr; }
      .bk-grid { grid-template-columns:1fr; }
      .pcard-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<div class="app">
<div class="main">
  <div class="header">
    <div class="logo"><em>PayAll</em> <span data-i18n="title">Smart Recommendations</span></div>
    <div class="lang-btns">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="langZh" onclick="setLang('zh')">中文</button>
    </div>
  </div>

  <div class="profile" id="profile" style="display:none"></div>

  <div id="spendingSection" style="display:none"></div>

  <div class="ctas" id="ctas" style="display:none">
    <div class="cta-card" id="ctaOpen"><div class="cta-icon">💳</div><div class="cta-label" data-i18n="cta_open">开卡</div><div class="cta-desc" data-i18n="cta_open_d">零KYC即刻开通 Bit2Go，用加密货币全球消费</div></div>
    <div class="cta-card" id="ctaTopup"><div class="cta-icon">⚡</div><div class="cta-label" data-i18n="cta_topup">充值</div><div class="cta-desc" data-i18n="cta_topup_d">USDT 秒充卡片，全球 Visa 商户即时可用</div></div>
    <div class="cta-card" id="ctaCashout"><div class="cta-icon">💵</div><div class="cta-label" data-i18n="cta_cashout">出金</div><div class="cta-desc" data-i18n="cta_cashout_d">加密货币 → 法币，提现到银行或直接刷卡</div></div>
  </div>

  <div class="progress" id="progress">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <div class="error-msg" id="error"></div>
  <div class="results" id="results"><div id="resultContent"></div></div>
</div>

<div class="chat">
  <div class="chat-hd">
    <div class="chat-dot"></div>
    <div>
      <div class="chat-hd-text" data-i18n="chat_title">AI 助手</div>
      <div class="chat-hd-sub" data-i18n="chat_sub">问我关于推荐的任何问题</div>
    </div>
  </div>
  <div class="chat-msgs" id="chatMessages">
    <div class="chat-empty" data-i18n="chat_empty">我会分析 Alan 的消费数据并给出推荐。之后你可以问我：为什么推荐这张卡？费用多少？怎么充值？</div>
  </div>
  <div class="quick-btns" id="quickBtns"></div>
  <div class="chat-in">
    <textarea class="chat-input" id="chatInput" rows="1" data-i18n-placeholder="chat_ph" placeholder="输入问题..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
    <button class="chat-send" id="chatSend" onclick="sendChat()" data-i18n="chat_send">发送</button>
  </div>
</div>
</div>

<div class="modal-overlay" id="openCardModal">
  <div class="modal">
    <h3 id="modalCardName"></h3>
    <div class="modal-step"><span>KYC</span><div class="toggle on" id="toggleKyc" onclick="this.classList.toggle('on')"></div></div>
    <div class="modal-step"><span data-i18n="m_topup">充值</span><div class="toggle on" id="toggleTopup" onclick="this.classList.toggle('on')"></div></div>
    <div class="modal-step"><span data-i18n="m_approval">审批</span><div class="toggle on" id="toggleApproval" onclick="this.classList.toggle('on')"></div></div>
    <div class="modal-btns">
      <button class="no" onclick="document.getElementById('openCardModal').classList.remove('visible')" data-i18n="m_cancel">取消</button>
      <button class="ok" onclick="submitOpenCard()" data-i18n="m_submit">提交</button>
    </div>
  </div>
</div>

<script>
let currentLang='zh', users=[], currentUserId=null, currentBaseRec=null, lastCardsMeta=null;
let openCardTargetId=null, openCardTargetName=null, chatContext='', chatMessages=[];
let currentEventSource=null, pipelineStepsDone=0, pipelineStepsTotal=5;

const I18N = {
  zh: {
    title:'智能推荐', cta_open:'开卡', cta_open_d:'零KYC即刻开通 Bit2Go，用加密货币全球消费',
    cta_topup:'充值', cta_topup_d:'USDT 秒充卡片，全球 Visa 商户即时可用',
    cta_cashout:'出金', cta_cashout_d:'加密货币 → 法币，提现到银行或直接刷卡',
    chat_title:'AI 助手', chat_sub:'问我关于推荐的任何问题',
    chat_empty:'我会分析 Alan 的消费数据并给出个性化推荐。之后你可以问我：\n\n• 为什么推荐这张卡？\n• 费用和手续费是多少？\n• 怎么充值和出金？\n• 和我现在的卡比有什么优势？',
    chat_ph:'输入问题...', chat_send:'发送',
    results_title:'你的个性化推荐', insights_hd:'我们从你的消费中发现了',
    bd_title:'评分透明解析', bk_title:'备选方案', wn_title:'为什么没推荐这些卡？',
    spending_title:'消费分析', analyzing:'正在分析中...',
    like:'赞同', dislike:'不合适', open_card:'开卡',
    q1:'为什么推荐这张卡？', q2:'充值500美元要多少USDT？', q3:'和Crypto.com比怎么样？',
    q4:'出金1000美元到银行多少手续费？', q5:'我的消费分析', q6:'有没有更高返现的卡？',
    m_topup:'充值', m_approval:'审批', m_cancel:'取消', m_submit:'提交',
    registered:'注册地', actual:'实际位置',
    has_bit2go:'已持有 Bit2Go', no_bit2go:'未持有 Bit2Go',
  },
  en: {
    title:'Smart Recommendations', cta_open:'Open Card', cta_open_d:'Get Bit2Go with zero KYC — spend crypto globally',
    cta_topup:'Top Up', cta_topup_d:'Load USDT instantly, spend anywhere Visa is accepted',
    cta_cashout:'Cash Out', cta_cashout_d:'Crypto → fiat, withdraw to bank or spend on card',
    chat_title:'AI Assistant', chat_sub:'Ask me anything about the recommendation',
    chat_empty:"I'll analyze Alan's spending data and give personalized recommendations. Then ask me:\n\n• Why this card?\n• What are the fees?\n• How to top up or cash out?\n• How does it compare to my current card?",
    chat_ph:'Type a question...', chat_send:'Send',
    results_title:'Your Personalized Recommendation', insights_hd:'What we found from your spending',
    bd_title:'Score Breakdown', bk_title:'Alternatives', wn_title:'Why not these cards?',
    spending_title:'Spending Analysis', analyzing:'Analyzing...',
    like:'Like', dislike:'Dislike', open_card:'Open Card',
    q1:'Why this card?', q2:'Simulate $500 topup', q3:'Compare with Crypto.com',
    q4:'Cash out $1000 — what are the fees?', q5:'My spending analysis', q6:'Any higher cashback cards?',
    m_topup:'Top-up', m_approval:'Approval', m_cancel:'Cancel', m_submit:'Submit',
    registered:'Registered', actual:'Actual',
    has_bit2go:'Has Bit2Go', no_bit2go:'No Bit2Go',
  }
};
function t(k){return I18N[currentLang]?.[k]||I18N.en[k]||k;}
function setLang(l){
  currentLang=l;
  document.getElementById('langEn').classList.toggle('active',l==='en');
  document.getElementById('langZh').classList.toggle('active',l==='zh');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.getAttribute('data-i18n-placeholder')));
  if(currentBaseRec&&lastCardsMeta)renderFinalRecommendation(currentBaseRec,lastCardsMeta);
}

async function init(){
  // Fire-and-forget precompute — warms the cache so selectUser → startPipeline hits it.
  fetch('/api/recommend/precompute?userId=6',{method:'POST'}).catch(()=>{});
  const res=await fetch('/api/users'); users=await res.json();
  // Auto-select Alan Walker (id: 6)
  const alan=users.find(u=>u.id==='6');
  if(alan)selectUser(alan);
}

function selectUser(user){
  currentUserId=user.id;
  fetch(`/api/recommend/precompute?userId=${user.id}`,{method:'POST'}).catch(()=>{});
  renderProfile(user);
  renderSpending(user);
  document.getElementById('ctas').style.display='grid';
  const has23=user.owned_card_ids.includes(23);
  document.getElementById('ctaOpen').classList.toggle('hl',!has23);
  document.getElementById('ctaTopup').classList.toggle('hl',has23);
  document.getElementById('ctaCashout').classList.toggle('hl',has23);
  chatMessages=[];
  document.getElementById('chatMessages').innerHTML=`<div class="chat-empty">${t('chat_empty').replace(/\n/g,'<br>')}</div>`;
  startPipeline(user.id);
}

function renderProfile(u){
  const has23=u.owned_card_ids.includes(23);
  document.getElementById('profile').style.display='block';
  document.getElementById('profile').innerHTML=`
    <div class="profile-top">
      <div><div class="profile-name">${u.name}</div><div class="profile-desc">${u.description}</div></div>
      <div class="profile-location">📍 ${t('registered')}: ${u.country} → ${t('actual')}: ${u.current_location}</div>
    </div>
    <div class="profile-tags">
      <span class="ptag ptag-g">$${u.monthly_spend_usd.toLocaleString()}/mo</span>
      ${u.priorities.slice(0,3).map(p=>`<span class="ptag ptag-p">${p.replace(/_/g,' ')}</span>`).join('')}
      <span class="ptag ${has23?'ptag-g':'ptag-y'}">${has23?t('has_bit2go'):t('no_bit2go')}</span>
      <span class="ptag ptag-d">${u.transaction_history.length} txns</span>
    </div>`;
}

function renderSpending(u){
  const sec=document.getElementById('spendingSection');
  if(!u.transaction_history.length){sec.style.display='none';return;}
  const cat={};let total=0;
  u.transaction_history.forEach(t=>{const c=t.category.replace(/_/g,' ');cat[c]=(cat[c]||0)+t.amount_usd;total+=t.amount_usd;});
  const sorted=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=sorted[0]?.[1]||1;
  sec.style.display='block';
  sec.innerHTML=`<div class="spending"><div class="spending-title">${t('spending_title')}</div><div class="spend-bars">${sorted.map(([name,amt])=>`
    <div class="spend-row">
      <div class="spend-cat">${name}</div>
      <div class="spend-track"><div class="spend-fill" style="width:${(amt/max*100).toFixed(0)}%"></div></div>
      <div class="spend-val">$${Math.round(amt).toLocaleString()}</div>
      <div class="spend-pct">${(amt/total*100).toFixed(0)}%</div>
    </div>`).join('')}</div></div>`;
}

// ---- Pipeline (hidden steps, show progress bar) ----
function startPipeline(userId){
  if(currentEventSource)currentEventSource.close();
  const p=document.getElementById('progress'); p.classList.add('visible');
  document.getElementById('progressFill').style.width='0%';
  document.getElementById('progressText').textContent=t('analyzing');
  document.getElementById('results').classList.remove('visible');
  document.getElementById('error').classList.remove('visible');
  pipelineStepsDone=0;

  currentEventSource=new EventSource(`/api/recommend/stream?userId=${userId}`);
  currentEventSource.addEventListener('plan',e=>{pipelineStepsTotal=JSON.parse(e.data).steps.length;});
  currentEventSource.addEventListener('step_start',()=>{});
  currentEventSource.addEventListener('step_stream',()=>{});
  currentEventSource.addEventListener('step_done',e=>{
    pipelineStepsDone++;
    const pct=Math.round(pipelineStepsDone/pipelineStepsTotal*100);
    document.getElementById('progressFill').style.width=pct+'%';
    const r=JSON.parse(e.data);
    document.getElementById('progressText').textContent=r.stepId==='final_recommendation'?'':r.reasoning?.slice(0,80)+'...';
  });
  currentEventSource.addEventListener('step_error',e=>{
    const d=JSON.parse(e.data);
    document.getElementById('error').textContent=d.error; document.getElementById('error').classList.add('visible');
    currentEventSource.close();
  });
  currentEventSource.addEventListener('step_warning',()=>{});
  currentEventSource.addEventListener('pipeline_done',e=>{
    const{recommendation,cards}=JSON.parse(e.data);
    currentBaseRec=recommendation; lastCardsMeta=cards;
    document.getElementById('progress').classList.remove('visible');
    buildChatContext(recommendation,cards);
    renderFinalRecommendation(recommendation,cards);
    currentEventSource.close();
  });
  currentEventSource.onerror=()=>currentEventSource.close();
}

// ---- Render results ----
const INS_ICON={location_inference:'📍',spending_pattern:'📊',gap_analysis:'🔍',savings_opportunity:'💰',pain_point:'⚠️'};
function sc(s){return s>=70?'hi':s>=40?'md':'lo';}

function renderFinalRecommendation(rec,cardsMeta){
  const cm={};(cardsMeta||[]).forEach(c=>cm[c.id]=c);
  const p=rec.primary, pc=cm[p.card_id]||{};

  const loc=rec.inferred_location;
  const locH=loc?`<div class="loc-badge">📍 ${loc.mismatch?loc.registered_country+' → <b>'+loc.city_or_region+'</b>':loc.city_or_region}</div>${loc.mismatch?'<div class="loc-explain">'+loc.explanation+'</div>':''}`:'';

  const ins=rec.insights||[];
  const insH=ins.length?`<div class="insights"><div class="insights-hd">${t('insights_hd')}</div>${ins.map(i=>`<div class="ins-item"><div class="ins-icon">${INS_ICON[i.type]||'💡'}</div><div><div class="ins-title">${i.title}</div><div class="ins-desc">${i.description}</div><div class="ins-ev">${i.evidence}</div></div></div>`).join('')}</div>`:'';

  const b=rec.bit2go_action;
  const b2gH=b?`<div class="b2g"><div class="b2g-badge">PayAll × Bit2Go</div><div class="b2g-hl">${b.headline}</div><div class="b2g-d">${b.description}</div><div class="b2g-v">${b.value_proposition}</div><div class="b2g-u">${b.urgency}</div><button class="b2g-btn">${b.cta_text}</button></div>`:'';

  const sav=p.savings_vs_current;
  const savH=sav&&sav.monthly_usd>0?`<div class="sav"><div><div class="sav-amt">+$${sav.monthly_usd}</div><div class="sav-per">/mo</div></div><div><div class="sav-det">${sav.breakdown}</div><div class="sav-yr">= $${sav.annual_usd}/yr</div></div></div>`:'';

  const hookH=p.conversion_hook?`<div class="hook">${p.conversion_hook}</div>`:'';

  const bd=p.score_breakdown||[];
  const bdH=bd.length?`<div class="bd"><div class="bd-title">${t('bd_title')}</div>${bd.map(d=>{const v=Math.round(d.score);return`<div class="bd-row"><div class="bd-head"><span class="bd-label">${d.label}</span><span class="bd-val">${v}</span></div><div class="bd-track"><div class="bd-fill ${sc(v)}" style="width:${v}%"></div></div><div class="bd-exp">${d.explanation}</div></div>`;}).join('')}</div>`:'';

  function chips(c){
    if(!c)return'';
    return [c.kyc_required?'<span class="chip">KYC</span>':'<span class="chip chip-g">No KYC</span>',
      c.apple_wallet_support?'<span class="chip">Apple Pay</span>':'',
      c.google_pay_support?'<span class="chip">Google Pay</span>':'',
      c.atm_withdrawal_support?'<span class="chip">ATM</span>':'',
    ].filter(Boolean).join('');
  }

  let h=`<div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:12px;">${t('results_title')}</div>
    ${locH}${insH}${b2gH}
    <div class="pcard"><div class="pcard-badge">BEST MATCH</div>
      <div class="pcard-head"><div class="pcard-name">${p.card_name}</div><div class="pcard-score ${sc(p.score)}">${p.score}</div></div>
      <div class="pcard-tag">${p.tagline}</div>
      <div class="pcard-chips">${chips(pc)}</div>
      ${hookH}${savH}
      <div class="pcard-reason">${p.reason}</div>
      ${bdH}
      <div class="pcard-grid"><div class="pro"><h4>✓ Pros</h4><ul>${(p.pros||[]).map(x=>'<li>'+x+'</li>').join('')}</ul></div><div class="con"><h4>✗ Cons</h4><ul>${(p.cons||[]).map(x=>'<li>'+x+'</li>').join('')}</ul></div></div>
      <div class="act">→ ${p.next_action?.description||''}</div>
      <div class="fb-btns">
        <button class="fb-btn" onclick="feedbackCard(${p.card_id},'like',this)">${t('like')}</button>
        <button class="fb-btn" onclick="feedbackCard(${p.card_id},'dislike',this)">${t('dislike')}</button>
        <button class="fb-btn" style="border-color:#2aaa6a;color:#6ee7b7;" onclick="openCardModal(${p.card_id},'${p.card_name.replace(/'/g,"\\'")}')">${t('open_card')}</button>
      </div>
      <div id="openingResult-${p.card_id}"></div>
    </div>
    <div class="bk-title">${t('bk_title')}</div>
    <div class="bk-grid">${(rec.backups||[]).map(bk=>{const bc=cm[bk.card_id]||{};return`<div class="bk-card">
      <div class="pcard-head"><div class="pcard-name">${bk.card_name}</div><div class="pcard-score ${sc(bk.score)}">${bk.score}</div></div>
      <div class="pcard-tag">${bk.tagline}</div>
      <div class="pcard-reason">${bk.reason}</div>
      ${bk.key_advantage?'<div class="bk-adv">'+bk.key_advantage+'</div>':''}
      <div class="bk-pti">${bk.pick_this_if}</div>
      <div class="fb-btns" style="margin-top:8px;"><button class="fb-btn" onclick="feedbackCard(${bk.card_id},'like',this)">${t('like')}</button><button class="fb-btn" onclick="feedbackCard(${bk.card_id},'dislike',this)">${t('dislike')}</button></div>
    </div>`;}).join('')}</div>`;

  if(rec.why_not_others?.length)h+=`<div class="wn-title" onclick="document.getElementById('wnl').classList.toggle('visible')">▸ ${t('wn_title')}</div><div class="wn-list" id="wnl">${rec.why_not_others.map(w=>`<div class="wn-item"><b>${w.card_name}:</b> ${w.reason}</div>`).join('')}</div>`;

  document.getElementById('resultContent').innerHTML=h;
  document.getElementById('results').classList.add('visible');
}

// ---- Chat ----
function buildChatContext(rec,cards){
  const u=users.find(u=>u.id===currentUserId); if(!u)return;
  const p=[`User: ${u.name}, ${u.description}`,`Monthly: $${u.monthly_spend_usd}`,`Registered: ${u.country}, Actual: ${u.current_location}`];
  if(rec.inferred_location)p.push(`Inferred: ${rec.inferred_location.city_or_region} (reg: ${rec.inferred_location.registered_country}, mismatch: ${rec.inferred_location.mismatch})`);
  p.push(`Owned cards: ${u.owned_card_ids.join(',')||'none'}`,`Priorities: ${u.priorities.join(',')}`);
  if(rec.insights)p.push(`Insights: ${rec.insights.map(i=>i.title+': '+i.description).join('; ')}`);
  p.push(`Primary: ${rec.primary.card_name} (${rec.primary.score})`,`Reason: ${rec.primary.reason}`);
  if(rec.primary.savings_vs_current)p.push(`Savings: $${rec.primary.savings_vs_current.monthly_usd}/mo — ${rec.primary.savings_vs_current.breakdown}`);
  if(rec.primary.conversion_hook)p.push(`Hook: ${rec.primary.conversion_hook}`);
  if(rec.bit2go_action)p.push(`Bit2Go: ${rec.bit2go_action.headline} — ${rec.bit2go_action.value_proposition}`);
  (rec.backups||[]).forEach(b=>p.push(`Backup: ${b.card_name}(${b.score}) — ${b.pick_this_if}`));
  (cards||[]).forEach(c=>p.push(`Card#${c.id} ${c.card_name}: KYC=${c.kyc_required}, fees=${c.fees}, cashback=${c.cashback_max}`));
  chatContext=p.join('\n');

  // Show quick action buttons
  renderQuickButtons();

  // Proactive greeting
  const greeting = currentLang === 'zh'
    ? `你好！我已经分析完 ${u.name} 的消费数据 🎯\n\n推荐了 **${rec.primary.card_name}**（评分 ${rec.primary.score}）。${rec.primary.conversion_hook || ''}\n\n有什么想了解的？可以点击下方快捷按钮，或者直接问我。`
    : `Hi! I've analyzed ${u.name}'s spending data 🎯\n\nRecommended **${rec.primary.card_name}** (score: ${rec.primary.score}). ${rec.primary.conversion_hook || ''}\n\nWhat would you like to know? Tap a quick button below or ask me anything.`;
  chatMessages = [{role:'assistant', content: greeting}];
  renderChat();
}

function renderQuickButtons(){
  const keys = ['q1','q2','q3','q4','q5','q6'];
  document.getElementById('quickBtns').innerHTML = keys.map(k =>
    `<button class="quick-btn" onclick="quickAsk('${k}')">${t(k)}</button>`
  ).join('');
}

function quickAsk(key){
  const text = t(key);
  document.getElementById('chatInput').value = text;
  sendChat();
}

async function sendChat(){
  const input=document.getElementById('chatInput'), msg=input.value.trim();
  if(!msg)return; input.value='';
  chatMessages.push({role:'user',content:msg});
  const aMsg={role:'assistant',content:''};
  chatMessages.push(aMsg); renderChat(true);
  document.getElementById('chatSend').disabled=true;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      messages:chatMessages.slice(0,-1).map(m=>({role:m.role,content:m.content.replace(/<[^>]*>/g,'')})),
      context:chatContext, lang:currentLang, userId:currentUserId
    })});
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const{done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const l of lines){
        if(!l.startsWith('data: '))continue;
        try{const d=JSON.parse(l.slice(6));
          if(d.tool){
            // Show tool execution indicator
            aMsg.content+=`\n<span class="tool-tag">${d.tool}</span>\n`;
            renderChat(true);
          }
          if(d.chunk){aMsg.content+=d.chunk;renderChat(true);}
          if(d.done||d.error)break;
        }catch{}
      }
    }
  }catch(e){aMsg.content+='[Error]';}
  renderChat(); document.getElementById('chatSend').disabled=false;
}

function formatMsg(text){
  if(!text)return'<span style="opacity:.3">...</span>';
  // Convert **bold** to <b>, preserve HTML tool-tags, convert newlines
  return text
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function renderChat(streaming=false){
  const c=document.getElementById('chatMessages');
  c.innerHTML=chatMessages.map((m,i)=>{
    const last=i===chatMessages.length-1;
    return`<div class="cmsg ${m.role==='user'?'u':'a'}${streaming&&last&&m.role==='assistant'?' streaming':''}">${formatMsg(m.content)}</div>`;
  }).join('');
  c.scrollTop=c.scrollHeight;
}

// ---- Feedback ----
async function feedbackCard(id,action,btn){
  await fetch('/api/feedback/card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:currentUserId,card_id:id,action})});
  if(action==='like')btn.classList.add('liked'); else startReRank();
}
function openCardModal(id,name){
  openCardTargetId=id;openCardTargetName=name;
  document.getElementById('modalCardName').textContent=name;
  ['toggleKyc','toggleTopup','toggleApproval'].forEach(i=>document.getElementById(i).classList.add('on'));
  document.getElementById('openCardModal').classList.add('visible');
}
async function submitOpenCard(){
  const k=document.getElementById('toggleKyc').classList.contains('on'),tp=document.getElementById('toggleTopup').classList.contains('on'),a=document.getElementById('toggleApproval').classList.contains('on');
  document.getElementById('openCardModal').classList.remove('visible');
  const res=await fetch('/api/feedback/open-card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:currentUserId,card_id:openCardTargetId,card_name:openCardTargetName,kyc_success:k,topup_success:tp,approval:a})});
  const d=await res.json();
  const el=document.getElementById(`openingResult-${openCardTargetId}`);
  if(el){const ok=k&&tp&&a;el.innerHTML=`<div style="margin-top:8px;padding:8px;border-radius:6px;font-size:12px;background:${ok?'#0a1a14':'#1a0a0a'};border:1px solid ${ok?'#1a3a2a':'#3a1a1a'};color:${ok?'#6ee7b7':'#f87171'};">KYC:${k?'✓':'✗'} ${t('m_topup')}:${tp?'✓':'✗'} ${t('m_approval')}:${a?'✓':'✗'}</div>`;}
  if(d.needs_rerank)setTimeout(startReRank,800);
}
function startReRank(){
  const es=new EventSource(`/api/recommend/rerank?userId=${currentUserId}`);
  document.getElementById('progress').classList.add('visible');
  document.getElementById('progressFill').style.width='50%';
  es.addEventListener('pipeline_done',e=>{
    const{recommendation,cards}=JSON.parse(e.data);
    currentBaseRec=recommendation;lastCardsMeta=cards;
    document.getElementById('progress').classList.remove('visible');
    buildChatContext(recommendation,cards);renderFinalRecommendation(recommendation,cards);es.close();
  });
  es.addEventListener('step_error',e=>{document.getElementById('error').textContent=JSON.parse(e.data).error;document.getElementById('error').classList.add('visible');es.close();});
  es.onerror=()=>es.close();
}

setLang('zh');
init();
</script>
